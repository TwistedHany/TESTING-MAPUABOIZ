<!DOCTYPE html>
<html lang="en" data-page="verification-single">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification Update – Single Unit · Inspection Record System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap">
  <link rel="stylesheet" href="static/css/global.css">
  <link rel="stylesheet" href="static/css/records.css">
  <link rel="stylesheet" href="static/css/verification.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="profile">
        <img class="profile__avatar" data-user="avatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" width="44" height="44">
        <div class="profile__text">
          <p class="profile__role" data-user="role"></p>
          <p class="profile__name" data-user="name"></p>
        </div>
      </div>

      <nav class="nav" aria-labelledby="nav-heading">
        <p class="nav__heading" id="nav-heading">Main</p>
        <ul class="nav__list" data-nav></ul>
      </nav>

      <div class="sidebar__footer">
        <a class="logout" href="index.html" data-action="logout">
          <i class="icon" data-icon="log-out" aria-hidden="true"></i>
          <span class="nav__label">Logout Account</span>
        </a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true" aria-label="Toggle sidebar">
          <i class="icon" data-icon="panel-left" aria-hidden="true"></i>
        </button>
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb">
          <li class="breadcrumb__item">Verification Update</li>
          <li class="breadcrumb__sep" aria-hidden="true">/</li>
          <li class="breadcrumb__item" aria-current="page">Single Unit</li>
          </ol>
        </nav>
        <div class="topbar__actions">
          <button type="button" class="icon-btn" data-action="toggle-theme" aria-pressed="false" aria-label="Switch to dark mode">
            <i class="icon" data-icon="moon" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn" data-action="toggle-history" aria-controls="history" aria-expanded="false" aria-label="History">
            <i class="icon" data-icon="history" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn" data-action="toggle-history" aria-controls="history" aria-expanded="false" aria-label="Toggle side panel">
            <i class="icon" data-icon="panel-right" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="content" id="content">
        <header class="page-header">
          <div>
            <h1 class="page-header__title">Verification Update</h1>
            <p class="page-header__desc">Search and verify the plate number, motor number, and chassis number.</p>
          </div>
        <div class="page-header__actions" data-collapse-empty>
          <button type="button" class="btn btn--outline" data-action="export">Export</button>
          <button type="button" class="btn btn--primary btn--lg" data-action="new-record">
            <i class="icon" data-icon="plus" aria-hidden="true"></i> New Record
          </button>
        </div>
        </header>

        <form class="search-bar verify-search" role="search" data-search-form>
          <label class="visually-hidden" for="unit-search">Search units</label>
          <input class="input input--search" id="unit-search" name="q" type="search" autocomplete="off"
            placeholder="Enter unit details (plate no.,engine number, chassis)">
        </form>

        <div class="split" data-split>
          <div class="split__list">
            <p class="count-label list-group__label">Results<span data-results-count hidden></span></p>
            <ul class="list" data-results-list aria-label="Results"></ul>
          </div>

          <section class="detail" data-detail aria-live="polite">
            <div class="empty-state" data-empty>
              <span class="empty-state__icon" aria-hidden="true"><i class="icon" data-icon="text-search"></i></span>
              <p class="empty-state__text">Select a result to view its record</p>
            </div>
            <div data-record hidden></div>
          </section>
        </div>
      </main>
    </div>

    <aside class="history" id="history" aria-labelledby="history-title">
      <h2 class="history__title" id="history-title">History</h2>
      <ol class="history__list" data-history-list></ol>
    </aside>
  </div>
</body>
</html>
