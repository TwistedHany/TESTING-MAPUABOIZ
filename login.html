<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Log in | Inspection Record System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap"
  >

  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
  
</head>

<body class="login-page">

  <main class="login">

    <section class="login__hero" aria-hidden="true">
      <p class="login__tagline">
        Franchise records and inspection records, in one place.
      </p>
    </section>

    <section class="login__panel" aria-labelledby="login-title">

      <form
        class="login-form"
        id="login-form"
        method="POST"
        novalidate
      >

        <h1 class="login-form__title" id="login-title">
          Login to your account
        </h1>

        <div class="login-form__field">

          <label class="login-form__label" for="email">
            Email
          </label>

          <input
            class="login-form__input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >

        </div>

        <div class="login-form__field">

          <div class="login-form__label-row">

            <label class="login-form__label" for="password">
              Password
            </label>

            <a class="login-form__link" href="#">
              Forgot?
            </a>

          </div>

          <div class="login-form__password">

            <input
              class="login-form__input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="login-form__reveal"
              data-action="toggle-password"
              aria-controls="password"
              aria-pressed="false"
              aria-label="Show password"
            >
              <i
                class="icon icon--md"
                data-icon="eye"
                aria-hidden="true"
              ></i>
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="login-form__submit"
        >
          Login now
        </button>

      </form>

    </section>

  </main>

  <script src="assets/js/login.js"></script>

</body>
</html>
